services:
  randly:
    build: .
    container_name: randly
    restart: unless-stopped
    depends_on:
      randly-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8788:8080"
    read_only: true
    tmpfs:
      - /data
      - /config
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  randly-api:
    build: ./api
    container_name: randly-api
    restart: unless-stopped
    environment:
      RANDLY_DB: /data/randly.sqlite3
      RANDLY_SECURE_COOKIES: "${RANDLY_SECURE_COOKIES:-true}"
    volumes:
      - randly-db:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  randly-db:
